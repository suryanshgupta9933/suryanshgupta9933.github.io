<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="wallTitle wallDesc">
  <title id="wallTitle">Two ways to reach a site you are signed in to</title>
  <desc id="wallDesc">Two rows of three boxes each. In the first row, under A BROWSER IN A DATA CENTRE: A fresh profile with nothing signed in, then a red-ruled The sign-in wall met on every site, then a red-ruled So we ask for your password — and hold on to it, sold as a feature. In the second row, under THE TAB YOU ARE ALREADY SIGNED IN TO: Your own tab, the session you have, then a green-ruled Already signed in through cookies, MFA and SSO, then Your inbox, with nothing to hand over.</desc>

  <rect width="900" height="384" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">
    <text x="32" y="34">A BROWSER IN A DATA CENTRE</text>
    <text x="32" y="238">THE TAB YOU ARE ALREADY SIGNED IN TO</text>
  </g>

  <!-- Track one: the wall. -->
  <g>
    <rect x="32" y="62" width="212" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">A fresh profile</text>
    <text x="52" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">nothing signed in</text>

    <line x1="244" y1="90" x2="274" y2="90" stroke="#C9C9C9"/>
    <path d="M280 90 L270 84 L270 96 Z" fill="#C9C9C9"/>

    <rect x="280" y="62" width="212" height="56" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="300" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#DC2626">The sign-in wall</text>
    <text x="300" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">every site, always</text>

    <line x1="492" y1="90" x2="522" y2="90" stroke="#C9C9C9"/>
    <path d="M528 90 L518 84 L518 96 Z" fill="#C9C9C9"/>

    <rect x="528" y="62" width="340" height="56" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="548" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#DC2626">So we ask for your password</text>
    <text x="548" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and hold on to it</text>
    <text x="548" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">sold as a feature</text>
  </g>

  <!-- Track two: no wall. -->
  <g>
    <rect x="32" y="266" width="212" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Your own tab</text>
    <text x="52" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the session you have</text>

    <line x1="244" y1="294" x2="274" y2="294" stroke="#C9C9C9"/>
    <path d="M280 294 L270 288 L270 300 Z" fill="#C9C9C9"/>

    <rect x="280" y="266" width="212" height="56" fill="#FFFFFF" stroke="#15803D"/>
    <text x="300" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#15803D">Already signed in</text>
    <text x="300" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">cookies &#183; MFA &#183; SSO</text>

    <line x1="492" y1="294" x2="522" y2="294" stroke="#C9C9C9"/>
    <path d="M528 294 L518 288 L518 300 Z" fill="#C9C9C9"/>

    <rect x="528" y="266" width="340" height="56" fill="#FFFFFF" stroke="#15803D"/>
    <text x="548" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#000000">Your inbox</text>
    <text x="548" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">nothing to hand over</text>
  </g>
</svg>
