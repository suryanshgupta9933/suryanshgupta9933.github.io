<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="wallTitle wallDesc">
  <title id="wallTitle">Two ways to reach a site you are signed in to</title>
  <desc id="wallDesc">Two rows of three boxes each. In the first row, captioned a browser in a data centre: a fresh profile with nothing signed in, then a red-ruled sign-in wall met on every site, then a red-ruled box saying so we ask for your password and hold on to it, sold as a feature. In the second row, captioned the tab you are already signed in to: your own tab with the session you have, then a green-ruled box saying already signed in through cookies, MFA and SSO, then your inbox, with nothing to hand over.</desc>

  <rect width="900" height="380" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">
    <text x="32" y="34">A BROWSER IN A DATA CENTRE</text>
    <text x="32" y="222">THE TAB YOU ARE ALREADY SIGNED IN TO</text>
  </g>

  <!-- Track one: the wall. -->
  <g>
    <rect x="32" y="58" width="212" height="76" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="138" y="160" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a fresh profile</text>
    <text x="138" y="175" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">nothing signed in</text>

    <line x1="244" y1="96" x2="274" y2="96" stroke="#C9C9C9"/>
    <path d="M280 96 L270 90 L270 102 Z" fill="#C9C9C9"/>

    <rect x="280" y="58" width="212" height="76" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="386" y="160" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the sign-in wall</text>
    <text x="386" y="175" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">every site, always</text>

    <line x1="492" y1="96" x2="522" y2="96" stroke="#C9C9C9"/>
    <path d="M528 96 L518 90 L518 102 Z" fill="#C9C9C9"/>

    <rect x="528" y="58" width="340" height="76" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="698" y="160" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">so we ask for your password</text>
    <text x="698" y="175" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and hold on to it</text>
    <text x="698" y="190" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">sold as a feature</text>
  </g>

  <!-- Track two: no wall. -->
  <g>
    <rect x="32" y="246" width="212" height="76" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="138" y="348" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your own tab</text>
    <text x="138" y="363" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the session you have</text>

    <line x1="244" y1="284" x2="274" y2="284" stroke="#C9C9C9"/>
    <path d="M280 284 L270 278 L270 290 Z" fill="#C9C9C9"/>

    <rect x="280" y="246" width="212" height="76" fill="#FFFFFF" stroke="#15803D"/>
    <text x="386" y="348" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">already signed in</text>
    <text x="386" y="363" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">cookies &#183; MFA &#183; SSO</text>

    <line x1="492" y1="284" x2="522" y2="284" stroke="#C9C9C9"/>
    <path d="M528 284 L518 278 L518 290 Z" fill="#C9C9C9"/>

    <rect x="528" y="246" width="340" height="76" fill="#FFFFFF" stroke="#15803D"/>
    <text x="698" y="348" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your inbox</text>
    <text x="698" y="363" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">nothing to hand over</text>
  </g>
</svg>