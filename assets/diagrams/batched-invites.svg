<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="batchTitle batchDesc">
  <title id="batchTitle">Admitted in batches, not as addresses arrive</title>
  <desc id="batchDesc">Two boxes side by side. The first holds The list — twelve pale squares standing for addresses, captioned no queue number, no rank to climb. The second, drawn with a heavier rule, holds A batch opens — three dark squares filled and four pale ones still waiting, captioned a few fill now, the rest wait. Below them two more boxes: What arrives, captioned an email, a code, the same extension; and What it is not, captioned not open signup, not a paid tier, not the better version.</desc>

  <rect width="900" height="320" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">ADMITTED IN BATCHES</text>

  <!-- The list: small squares are addresses. No names, no rank. -->
  <g>
    <rect x="32" y="56" width="360" height="100" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">The list</text>
    <g fill="#C9C9C9">
      <rect x="52" y="128" width="12" height="12"/><rect x="70" y="128" width="12" height="12"/>
      <rect x="88" y="128" width="12" height="12"/><rect x="106" y="128" width="12" height="12"/>
      <rect x="124" y="128" width="12" height="12"/><rect x="142" y="128" width="12" height="12"/>
      <rect x="160" y="128" width="12" height="12"/><rect x="178" y="128" width="12" height="12"/>
      <rect x="196" y="128" width="12" height="12"/><rect x="214" y="128" width="12" height="12"/>
      <rect x="232" y="128" width="12" height="12"/><rect x="250" y="128" width="12" height="12"/>
    </g>
    <text x="52" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">no queue number &#183; no rank to climb</text>
  </g>

  <line x1="392" y1="106" x2="422" y2="106" stroke="#C9C9C9"/>
  <path d="M428 106 L418 100 L418 112 Z" fill="#C9C9C9"/>

  <!-- The batch: one heavier box, a few seats filled. -->
  <g>
    <rect x="428" y="56" width="300" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="448" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">A batch opens</text>
    <g fill="#000000">
      <rect x="448" y="128" width="12" height="12"/><rect x="466" y="128" width="12" height="12"/>
      <rect x="484" y="128" width="12" height="12"/>
    </g>
    <g fill="#EBEBEB">
      <rect x="502" y="128" width="12" height="12"/><rect x="520" y="128" width="12" height="12"/>
      <rect x="538" y="128" width="12" height="12"/><rect x="556" y="128" width="12" height="12"/>
    </g>
    <text x="448" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a few fill now &#183; the rest wait</text>
  </g>

  <!-- What arrives / what it is not. -->
  <g>
    <rect x="32" y="212" width="360" height="60" fill="#FFFFFF" stroke="#15803D"/>
    <text x="52" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#15803D">What arrives</text>
    <text x="52" y="298" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">an email, a code, the same extension</text>

    <rect x="428" y="212" width="440" height="60" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="448" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">What it is not</text>
    <text x="448" y="298" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">not open signup &#183; not a paid tier &#183; not the better version</text>
  </g>
</svg>
