<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="batchTitle batchDesc">
  <title id="batchTitle">Admitted in batches, not as addresses arrive</title>
  <desc id="batchDesc">Two boxes side by side. The first, captioned the list, holds twelve pale squares standing for addresses and carries no queue number. The second, captioned a batch opens, holds three dark squares filled and four pale ones still waiting, and is drawn with a heavier rule. Below them two more boxes: what arrives is an email, a six-digit code and the same extension; what it is not is open signup, a paid tier, or the better version.</desc>

  <rect width="900" height="320" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">ADMITTED IN BATCHES</text>

  <!-- The list: small squares are addresses. No names, no rank. -->
  <g>
    <rect x="32" y="56" width="360" height="76" fill="#FFFFFF" stroke="#C9C9C9"/>
    <g fill="#C9C9C9">
      <rect x="52" y="88" width="12" height="12"/><rect x="70" y="88" width="12" height="12"/>
      <rect x="88" y="88" width="12" height="12"/><rect x="106" y="88" width="12" height="12"/>
      <rect x="124" y="88" width="12" height="12"/><rect x="142" y="88" width="12" height="12"/>
      <rect x="160" y="88" width="12" height="12"/><rect x="178" y="88" width="12" height="12"/>
      <rect x="196" y="88" width="12" height="12"/><rect x="214" y="88" width="12" height="12"/>
      <rect x="232" y="88" width="12" height="12"/><rect x="250" y="88" width="12" height="12"/>
    </g>
    <text x="212" y="158" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the list</text>
    <text x="212" y="173" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">no queue number &#183; no rank to climb</text>
  </g>

  <line x1="392" y1="94" x2="422" y2="94" stroke="#C9C9C9"/>
  <path d="M428 94 L418 88 L418 100 Z" fill="#C9C9C9"/>

  <!-- The batch: one heavier box, a few seats filled. -->
  <g>
    <rect x="428" y="56" width="300" height="76" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <g fill="#000000">
      <rect x="448" y="88" width="12" height="12"/><rect x="466" y="88" width="12" height="12"/>
      <rect x="484" y="88" width="12" height="12"/>
    </g>
    <g fill="#EBEBEB">
      <rect x="502" y="88" width="12" height="12"/><rect x="520" y="88" width="12" height="12"/>
      <rect x="538" y="88" width="12" height="12"/><rect x="556" y="88" width="12" height="12"/>
    </g>
    <text x="578" y="158" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a batch opens</text>
    <text x="578" y="173" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a few fill now &#183; the rest wait</text>
  </g>

  <!-- What arrives / what it is not. -->
  <g>
    <rect x="32" y="212" width="360" height="56" fill="#FFFFFF" stroke="#15803D"/>
    <text x="212" y="292" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">what arrives</text>
    <text x="212" y="307" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">an email, a code, the same extension</text>

    <rect x="428" y="212" width="440" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="648" y="292" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">what it is not</text>
    <text x="648" y="307" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">not open signup &#183; not a paid tier &#183; not the better version</text>
  </g>
</svg>