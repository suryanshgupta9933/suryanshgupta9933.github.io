<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="batchTitle batchDesc">
  <title id="batchTitle">Admitted in batches, not as addresses arrive</title>
  <desc id="batchDesc">Addresses sit on a list with no queue number. When a batch opens, a few seats fill now and the rest wait. What arrives is an email, a six-digit code and the same extension. What it is not: open signup, a paid tier, or the better version.</desc>

  <rect width="900" height="280" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">ADMITTED IN BATCHES</text>

  <!-- The list: small squares are addresses. No names, no rank. -->
  <g>
    <rect x="32" y="52" width="360" height="110" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="82" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#000000">The list</text>
    <g fill="#C9C9C9">
      <rect x="52" y="98" width="12" height="12"/><rect x="70" y="98" width="12" height="12"/>
      <rect x="88" y="98" width="12" height="12"/><rect x="106" y="98" width="12" height="12"/>
      <rect x="124" y="98" width="12" height="12"/><rect x="142" y="98" width="12" height="12"/>
      <rect x="160" y="98" width="12" height="12"/><rect x="178" y="98" width="12" height="12"/>
      <rect x="196" y="98" width="12" height="12"/><rect x="214" y="98" width="12" height="12"/>
      <rect x="232" y="98" width="12" height="12"/><rect x="250" y="98" width="12" height="12"/>
    </g>
    <text x="52" y="142" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6E6E6E">no queue number · no rank to climb</text>
  </g>

  <line x1="392" y1="107" x2="422" y2="107" stroke="#C9C9C9"/>
  <path d="M428 107 L418 101 L418 113 Z" fill="#C9C9C9"/>

  <!-- The batch: one heavier box, a few seats filled. -->
  <g>
    <rect x="428" y="52" width="300" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="448" y="82" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#000000">A batch opens</text>
    <g fill="#000000">
      <rect x="448" y="98" width="12" height="12"/><rect x="466" y="98" width="12" height="12"/>
      <rect x="484" y="98" width="12" height="12"/>
    </g>
    <g fill="#EBEBEB">
      <rect x="502" y="98" width="12" height="12"/><rect x="520" y="98" width="12" height="12"/>
      <rect x="538" y="98" width="12" height="12"/><rect x="556" y="98" width="12" height="12"/>
    </g>
    <text x="448" y="142" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6E6E6E">filled now · the rest wait</text>
  </g>

  <!-- What arrives / what it is not. -->
  <g>
    <rect x="32" y="186" width="360" height="64" fill="#FFFFFF" stroke="#15803D"/>
    <text x="52" y="214" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#15803D">What arrives</text>
    <text x="52" y="236" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#5C5C5C">An email, a code, the same extension.</text>

    <rect x="428" y="186" width="440" height="64" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="448" y="214" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#000000">What it is not</text>
    <text x="448" y="236" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#5C5C5C">Not open signup. Not a paid tier. Not the better version.</text>
  </g>
</svg>
