<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="batchTitle batchDesc">
  <title id="batchTitle">Admitted in batches, not as addresses arrive</title>
  <desc id="batchDesc">Your address joins a list. The list is admitted in batches — a few seats at a time — so an invitation is a batch landing, not a queue position you can watch. When a batch opens, the invitation arrives by email with a six-digit code, and the same extension connects.</desc>

  <rect width="900" height="380" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">
    <text x="32" y="34">THE LIST</text>
    <text x="32" y="238">A BATCH, WHEN ONE OPENS</text>
  </g>

  <!-- Track one: the list. Small squares are addresses — no names, no queue
       position, because there is not one. -->
  <g>
    <rect x="32" y="58" width="404" height="132" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="56" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Addresses waiting</text>

    <g fill="#C9C9C9">
      <rect x="56" y="112" width="14" height="14"/>
      <rect x="78" y="112" width="14" height="14"/>
      <rect x="100" y="112" width="14" height="14"/>
      <rect x="122" y="112" width="14" height="14"/>
      <rect x="144" y="112" width="14" height="14"/>
      <rect x="166" y="112" width="14" height="14"/>
      <rect x="188" y="112" width="14" height="14"/>
      <rect x="210" y="112" width="14" height="14"/>
      <rect x="232" y="112" width="14" height="14"/>
      <rect x="254" y="112" width="14" height="14"/>
      <rect x="276" y="112" width="14" height="14"/>
      <rect x="298" y="112" width="14" height="14"/>
      <rect x="320" y="112" width="14" height="14"/>
      <rect x="342" y="112" width="14" height="14"/>
      <rect x="364" y="112" width="14" height="14"/>
      <rect x="386" y="112" width="14" height="14"/>
    </g>

    <text x="56" y="160" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#6E6E6E">one row per address · no queue number</text>
    <text x="56" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#5C5C5C">You are on it, or you are not — there is no rank to climb.</text>
  </g>

  <line x1="436" y1="124" x2="466" y2="124" stroke="#C9C9C9"/>
  <path d="M472 124 L462 118 L462 130 Z" fill="#C9C9C9"/>

  <!-- The batch itself: one heavier box, a few squares inside it. -->
  <g>
    <rect x="472" y="58" width="396" height="132" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="496" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">A batch of seats</text>

    <g fill="#000000">
      <rect x="496" y="112" width="14" height="14"/>
      <rect x="518" y="112" width="14" height="14"/>
      <rect x="540" y="112" width="14" height="14"/>
      <rect x="562" y="112" width="14" height="14"/>
    </g>
    <g fill="#EBEBEB">
      <rect x="584" y="112" width="14" height="14"/>
      <rect x="606" y="112" width="14" height="14"/>
      <rect x="628" y="112" width="14" height="14"/>
      <rect x="650" y="112" width="14" height="14"/>
    </g>

    <text x="496" y="160" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#6E6E6E">filled now · the rest wait</text>
    <text x="496" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#5C5C5C">Invited by email. An invitation is not a subscription.</text>
  </g>

  <!-- Track two: what arrives, and what it is not. -->
  <g>
    <rect x="32" y="262" width="404" height="88" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="56" y="300" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">What arrives</text>
    <text x="56" y="328" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#5C5C5C">An email, a six-digit code, the same extension.</text>

    <rect x="472" y="262" width="396" height="88" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="496" y="300" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">What it is not</text>
    <text x="496" y="328" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#5C5C5C">Not open signup. Not a paid tier. Not the better version.</text>
  </g>
</svg>
