<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="installTitle installDesc">
  <title id="installTitle">The install path</title>
  <desc id="installDesc">Two doors in and one path out: paste a prompt into an AI coding tool, or run four commands by hand. Either way a container starts on your machine at 127.0.0.1:8000, the extension is added from the Chrome Web Store and pointed at it, and a task runs in the tab you are already signed in to.</desc>

  <rect width="900" height="290" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">TWO DOORS IN, ONE PATH OUT</text>

  <!-- The fork: two ways to do the same job. -->
  <g>
    <rect x="32" y="48" width="168" height="64" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="116" y="138" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">an AI prompt</text>

    <rect x="32" y="145" width="168" height="64" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="116" y="235" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">four commands</text>

    <!-- Both doors meet the same line. -->
    <line x1="200" y1="80" x2="230" y2="80" stroke="#C9C9C9"/>
    <line x1="200" y1="177" x2="230" y2="177" stroke="#C9C9C9"/>
    <line x1="230" y1="80" x2="230" y2="177" stroke="#C9C9C9"/>
    <line x1="230" y1="128" x2="256" y2="128" stroke="#C9C9C9"/>
    <path d="M262 128 L252 122 L252 134 Z" fill="#C9C9C9"/>
  </g>

  <!-- The container: heavier rule, because it is the object that lands on disk. -->
  <g>
    <rect x="262" y="96" width="200" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="362" y="186" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the container</text>
    <text x="362" y="201" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">127.0.0.1:8000 &#183; no browser</text>

    <line x1="462" y1="128" x2="492" y2="128" stroke="#C9C9C9"/>
    <path d="M498 128 L488 122 L488 134 Z" fill="#C9C9C9"/>
  </g>

  <!-- The extension: two fields, then a run. -->
  <g>
    <rect x="498" y="96" width="176" height="64" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="586" y="186" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">the extension</text>
    <text x="586" y="201" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">connection</text>
    <text x="586" y="216" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">model key</text>

    <line x1="674" y1="128" x2="704" y2="128" stroke="#C9C9C9"/>
    <path d="M710 128 L700 122 L700 134 Z" fill="#C9C9C9"/>
  </g>

  <!-- The outcome: the tab you already have open. -->
  <g>
    <rect x="710" y="96" width="158" height="64" fill="#FFFFFF" stroke="#15803D"/>
    <text x="789" y="186" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#15803D">a task runs</text>
    <text x="789" y="201" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">in the tab you are</text>
    <text x="789" y="216" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">already signed in to</text>
  </g>

  <line x1="32" y1="252" x2="868" y2="252" stroke="#E5E5E5"/>
  <text x="32" y="272" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">NO ACCOUNT &#183; ON YOUR DISK &#183; TWO FIELDS &#183; YOUR KEY</text>
</svg>