<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="installTitle installDesc">
  <title id="installTitle">The install path</title>
  <desc id="installDesc">Two doors in and one path out. Paste a prompt into an AI coding tool, or run four commands by hand — each door is a box naming itself. Both meet The container, headed ON YOUR MACHINE and captioned 127.0.0.1:8000, plans the work, no browser. Then The extension, headed IN CHROME and captioned connection, model key. Then a green box headed DONE reading A task runs, captioned in the tab you are already signed in to.</desc>

  <rect width="900" height="250" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">TWO DOORS IN, ONE PATH OUT</text>

  <!-- The fork: two ways to do the same job. Headline only. These two boxes
       name the door and carry no supporting detail, so a caption row under
       them would be decoration rather than a fact. -->
  <g>
    <rect x="32" y="56" width="168" height="52" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="88" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">an AI prompt</text>

    <rect x="32" y="112" width="168" height="52" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="144" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="600" fill="#000000">four commands</text>

    <!-- Both doors meet the same line. -->
    <line x1="200" y1="82" x2="230" y2="82" stroke="#C9C9C9"/>
    <line x1="200" y1="138" x2="230" y2="138" stroke="#C9C9C9"/>
    <line x1="230" y1="82" x2="230" y2="138" stroke="#C9C9C9"/>
    <line x1="230" y1="110" x2="256" y2="110" stroke="#C9C9C9"/>
    <path d="M262 110 L252 104 L252 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The container: heavier rule, because it is the object that lands on disk. -->
  <g>
    <rect x="262" y="68" width="200" height="84" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="282" y="98" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#6E6E6E">ON YOUR MACHINE</text>
    <text x="282" y="128" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">The container</text>

    <text x="282" y="178" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5C5C5C">127.0.0.1:8000</text>
    <text x="282" y="194" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">plans the work &#183; no browser</text>

    <line x1="462" y1="110" x2="492" y2="110" stroke="#C9C9C9"/>
    <path d="M498 110 L488 104 L488 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The extension: two fields, then a run. -->
  <g>
    <rect x="498" y="68" width="176" height="84" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="518" y="98" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#6E6E6E">IN CHROME</text>
    <text x="518" y="128" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">The extension</text>

    <text x="518" y="178" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5C5C5C">connection</text>
    <text x="518" y="194" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5C5C5C">model key</text>

    <line x1="674" y1="110" x2="704" y2="110" stroke="#C9C9C9"/>
    <path d="M710 110 L700 104 L700 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The outcome: the tab you already have open. -->
  <g>
    <rect x="710" y="68" width="158" height="84" fill="#FFFFFF" stroke="#15803D"/>
    <text x="730" y="98" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#15803D">DONE</text>
    <text x="730" y="128" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#15803D">A task runs</text>

    <text x="730" y="178" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">in the tab you are</text>
    <text x="730" y="194" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">already signed in to</text>
  </g>

  <line x1="32" y1="212" x2="868" y2="212" stroke="#E5E5E5"/>
  <text x="32" y="232" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">NO ACCOUNT &#183; ON YOUR DISK &#183; TWO FIELDS &#183; YOUR KEY</text>
</svg>
