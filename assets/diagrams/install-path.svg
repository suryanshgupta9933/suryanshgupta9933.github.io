<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="installTitle installDesc">
  <title id="installTitle">The install path</title>
  <desc id="installDesc">Two doors in and one path out: paste a prompt into an AI coding tool, or run four commands by hand. Either way a container starts on your machine at 127.0.0.1:8000, the extension is added from the Chrome Web Store and pointed at it, and a task runs in the tab you are already signed in to.</desc>

  <rect width="900" height="220" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">TWO DOORS IN, ONE PATH OUT</text>

  <!-- The fork: two ways to do the same job. -->
  <g>
    <rect x="32" y="52" width="168" height="52" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="48" y="84" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#5C5C5C">an AI prompt</text>

    <rect x="32" y="116" width="168" height="52" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="48" y="148" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5C5C5C">four commands</text>

    <!-- Both doors meet the same line. -->
    <line x1="200" y1="78" x2="230" y2="78" stroke="#C9C9C9"/>
    <line x1="200" y1="142" x2="230" y2="142" stroke="#C9C9C9"/>
    <line x1="230" y1="78" x2="230" y2="142" stroke="#C9C9C9"/>
    <line x1="230" y1="110" x2="256" y2="110" stroke="#C9C9C9"/>
    <path d="M262 110 L252 104 L252 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The container: heavier rule, because it is the object that lands on disk. -->
  <g>
    <rect x="262" y="52" width="200" height="116" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="282" y="82" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#6E6E6E">ON YOUR MACHINE</text>
    <text x="282" y="114" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">The container</text>
    <text x="282" y="142" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5C5C5C">127.0.0.1:8000</text>
    <text x="282" y="162" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#6E6E6E">plans the work · no browser</text>

    <line x1="462" y1="110" x2="492" y2="110" stroke="#C9C9C9"/>
    <path d="M498 110 L488 104 L488 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The extension: two fields, then a run. -->
  <g>
    <rect x="498" y="52" width="176" height="116" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="518" y="82" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#6E6E6E">IN CHROME</text>
    <text x="518" y="114" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">The extension</text>
    <text x="518" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#5C5C5C">store install, then</text>
    <text x="518" y="162" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6E6E6E">connection · model key</text>

    <line x1="674" y1="110" x2="704" y2="110" stroke="#C9C9C9"/>
    <path d="M710 110 L700 104 L700 116 Z" fill="#C9C9C9"/>
  </g>

  <!-- The outcome: the tab you already have open. -->
  <g>
    <rect x="710" y="52" width="158" height="116" fill="#FFFFFF" stroke="#15803D"/>
    <text x="730" y="82" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.4" fill="#15803D">DONE</text>
    <text x="730" y="114" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#15803D">A task runs</text>
    <text x="730" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#5C5C5C">in the tab you are</text>
    <text x="730" y="162" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#5C5C5C">already signed in to</text>
  </g>

  <line x1="32" y1="192" x2="868" y2="192" stroke="#E5E5E5"/>
  <text x="32" y="212" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">NO ACCOUNT · ON YOUR DISK · TWO FIELDS · YOUR KEY</text>
</svg>
