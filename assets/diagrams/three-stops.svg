<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="stopsTitle stopsDesc">
  <title id="stopsTitle">The three things it stops for</title>
  <desc id="stopsDesc">Three boxes, each with its keywords captioned beneath, and each resolving in place. A red-ruled box for a domain it has not visited: approve once and the grant outlives the run. A plain box for a question the page made ambiguous: it asks rather than guess and cost you the backtrack. A red-ruled box for a sign-in wall: it hands the sign-in back and picks up after. None of them can approve themselves.</desc>

  <rect width="900" height="250" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">WHAT IT STOPS FOR</text>

  <!-- Card 1: a domain it has not visited. -->
  <g>
    <rect x="32" y="56" width="260" height="76" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="162" y="158" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a domain it has not visited</text>
    <text x="162" y="173" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">approve once, and the grant</text>
    <text x="162" y="188" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">outlives the run</text>
  </g>

  <!-- Card 2: a question the page made ambiguous. -->
  <g>
    <rect x="320" y="56" width="260" height="76" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="450" y="158" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a question the page made ambiguous</text>
    <text x="450" y="173" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">it asks, rather than guess</text>
    <text x="450" y="188" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and cost you the backtrack</text>
  </g>

  <!-- Card 3: a sign-in wall. -->
  <g>
    <rect x="608" y="56" width="260" height="76" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="738" y="158" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a sign-in wall that needs you</text>
    <text x="738" y="173" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">it hands the sign-in back</text>
    <text x="738" y="188" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and picks up after</text>
  </g>

  <text x="32" y="232" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">NO SETTING TURNS ANY OF THEM OFF</text>
</svg>