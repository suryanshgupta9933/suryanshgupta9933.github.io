<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 238" width="900" height="238" role="img" aria-labelledby="stopsTitle stopsDesc">
  <title id="stopsTitle">The three things it stops for</title>
  <desc id="stopsDesc">Three cards, each resolving in place. A red-ruled card headed A NEW DOMAIN, It has not been here — approve once, and the grant outlives the run. A plain card headed A CHOICE, Two good answers — it asks rather than guess and cost you the backtrack. A red-ruled card headed A WALL, Only you can pass — it hands the sign-in back and picks up after. None of them can approve themselves.</desc>

  <rect width="900" height="238" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">WHAT IT STOPS FOR</text>

  <!-- Card 1: a domain it has not visited. -->
  <g>
    <rect x="32" y="56" width="260" height="84" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="52" y="86" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#DC2626">A NEW DOMAIN</text>
    <text x="52" y="116" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">It has not been here</text>

    <text x="52" y="166" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">Approve once, and the grant</text>
    <text x="52" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">outlives the run.</text>
  </g>

  <!-- Card 2: a question the page made ambiguous. -->
  <g>
    <rect x="320" y="56" width="260" height="84" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="340" y="86" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#6E6E6E">A CHOICE</text>
    <text x="340" y="116" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Two good answers</text>

    <text x="340" y="166" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">It asks, rather than guess</text>
    <text x="340" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and cost you the backtrack.</text>
  </g>

  <!-- Card 3: a sign-in wall. -->
  <g>
    <rect x="608" y="56" width="260" height="84" fill="#FFFFFF" stroke="#DC2626"/>
    <text x="628" y="86" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#DC2626">A WALL</text>
    <text x="628" y="116" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Only you can pass</text>

    <text x="628" y="166" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">It hands the sign-in back</text>
    <text x="628" y="182" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">and picks up after.</text>
  </g>

  <text x="32" y="218" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">NO SETTING TURNS ANY OF THEM OFF</text>
</svg>
