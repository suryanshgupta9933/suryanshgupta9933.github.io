<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img" aria-labelledby="readsTitle readsDesc">
  <title id="readsTitle">One control, read two ways</title>
  <desc id="readsDesc">The same page shown as a vision model sees it, as a set of unlabelled rectangles, and as Brotto reads it, as the roles and names the page itself publishes.</desc>

  <rect width="900" height="386" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">
    <text x="32" y="34">WHAT A VISION MODEL SEES</text>
    <text x="464" y="34">WHAT BROTTO READS</text>
  </g>

  <!-- Left: the picture. -->
  <rect x="32" y="58" width="404" height="220" fill="#FFFFFF" stroke="#C9C9C9"/>

  <g fill="#EBEBEB">
    <rect x="52" y="76" width="364" height="26"/>
    <rect x="52" y="116" width="40" height="16"/>
    <rect x="104" y="116" width="40" height="16"/>
    <rect x="156" y="116" width="40" height="16"/>
    <rect x="208" y="116" width="40" height="16"/>
    <rect x="52" y="146" width="364" height="22"/>
    <rect x="52" y="178" width="364" height="22"/>
    <rect x="52" y="210" width="364" height="22"/>
  </g>

  <rect x="52" y="246" width="110" height="26" fill="#EBEBEB" stroke="#DC2626"/>
  <text x="172" y="264" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#DC2626">a rounded rectangle</text>

  <g font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#5C5C5C">
    <text x="32" y="306">Everything here is a shape.</text>
    <text x="32" y="326">Whether that box is a button, a tab, a</text>
    <text x="32" y="346">checkbox or an ad is something the model</text>
    <text x="32" y="366">has to infer from the picture.</text>
  </g>

  <!-- Right: the structure. -->
  <rect x="464" y="58" width="404" height="220" fill="#FFFFFF" stroke="#C9C9C9"/>

  <text x="484" y="84" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#6E6E6E">WHAT THE PAGE PUBLISHES</text>

  <rect x="484" y="101" width="364" height="24" fill="#F5F5F5" stroke="#15803D"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14">
    <text x="492" y="118" fill="#15803D">button</text>
    <text x="608" y="118" fill="#000000">"Merge pull request"</text>
    <text x="840" y="118" fill="#C9C9C9" text-anchor="end">e42</text>

    <text x="492" y="146" fill="#6E6E6E">textbox</text>
    <text x="608" y="146" fill="#000000">"Search or jump to&#8230;"</text>
    <text x="840" y="146" fill="#C9C9C9" text-anchor="end">e11</text>

    <text x="492" y="174" fill="#6E6E6E">link</text>
    <text x="608" y="174" fill="#000000">"suryansh / Brotto"</text>
    <text x="840" y="174" fill="#C9C9C9" text-anchor="end">e7</text>

    <text x="492" y="202" fill="#6E6E6E">combobox</text>
    <text x="608" y="202" fill="#000000">"base: main"</text>
    <text x="840" y="202" fill="#C9C9C9" text-anchor="end">e58</text>

    <text x="492" y="230" fill="#6E6E6E">checkbox</text>
    <text x="608" y="230" fill="#000000">"Require status checks"</text>
    <text x="840" y="230" fill="#C9C9C9" text-anchor="end">e63</text>
  </g>

  <line x1="484" y1="248" x2="848" y2="248" stroke="#E5E5E5"/>

  <g font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#5C5C5C">
    <text x="464" y="306">A button is a button because the page</text>
    <text x="464" y="326">says so. Role, name, value and a reference</text>
    <text x="464" y="346">it can act on — no inference, nothing to</text>
    <text x="464" y="366">guess, and no image tokens.</text>
  </g>
</svg>