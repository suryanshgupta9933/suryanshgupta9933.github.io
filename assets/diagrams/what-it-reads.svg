<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="readsTitle readsDesc">
  <title id="readsTitle">One control, read two ways</title>
  <desc id="readsDesc">The same page shown as a vision model sees it, as a set of unlabelled rectangles, and as Brotto reads it, as the roles and names the page itself publishes.</desc>

  <rect width="1200" height="470" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#6E6E6E">
    <text x="60" y="38">WHAT A VISION MODEL SEES</text>
    <text x="620" y="38">WHAT BROTTO READS</text>
  </g>

  <!-- Left: the picture. -->
  <rect x="60" y="64" width="520" height="330" fill="#FFFFFF" stroke="#C9C9C9"/>

  <g fill="#EBEBEB">
    <rect x="84" y="88" width="472" height="36"/>
    <rect x="84" y="144" width="56" height="20"/>
    <rect x="152" y="144" width="56" height="20"/>
    <rect x="220" y="144" width="56" height="20"/>
    <rect x="288" y="144" width="56" height="20"/>
    <rect x="84" y="196" width="472" height="28"/>
    <rect x="84" y="236" width="472" height="28"/>
    <rect x="84" y="276" width="472" height="28"/>
  </g>

  <rect x="84" y="320" width="140" height="34" fill="#EBEBEB" stroke="#DC2626"/>
  <text x="240" y="341" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#DC2626">a rounded rectangle</text>

  <g font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#5C5C5C">
    <text x="60" y="422">Everything here is a shape.</text>
    <text x="60" y="442">Whether that box is a button, a tab, a checkbox or an ad is</text>
    <text x="60" y="462">something the model has to infer from the picture.</text>
  </g>

  <!-- Right: the structure. -->
  <rect x="620" y="64" width="520" height="330" fill="#FFFFFF" stroke="#C9C9C9"/>

  <text x="644" y="96" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E6E">WHAT THE PAGE PUBLISHES</text>

  <rect x="640" y="112" width="480" height="24" fill="#F5F5F5" stroke="#15803D"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <text x="648" y="128" fill="#15803D">button</text>
    <text x="712" y="128" fill="#000000">"Merge pull request"</text>
    <text x="1096" y="128" fill="#C9C9C9">e42</text>

    <text x="648" y="164" fill="#6E6E6E">textbox</text>
    <text x="712" y="164" fill="#000000">"Search or jump to&#8230;"</text>
    <text x="1096" y="164" fill="#C9C9C9">e11</text>

    <text x="648" y="200" fill="#6E6E6E">link</text>
    <text x="712" y="200" fill="#000000">"suryansh / Brotto"</text>
    <text x="1096" y="200" fill="#C9C9C9">e7</text>

    <text x="648" y="236" fill="#6E6E6E">combobox</text>
    <text x="712" y="236" fill="#000000">"base: main"</text>
    <text x="1096" y="236" fill="#C9C9C9">e58</text>

    <text x="648" y="272" fill="#6E6E6E">checkbox</text>
    <text x="712" y="272" fill="#000000">"Require status checks"</text>
    <text x="1096" y="272" fill="#C9C9C9">e63</text>
  </g>

  <line x1="644" y1="300" x2="1116" y2="300" stroke="#E5E5E5"/>

  <g font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#5C5C5C">
    <text x="644" y="330">A button is a button because the page says so.</text>
    <text x="644" y="352">Role, name, value and a reference it can act on.</text>
    <text x="644" y="374">No inference, no image tokens, nothing to guess.</text>
  </g>

  <g font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#5C5C5C">
    <text x="620" y="422">The screen reader already navigates this.</text>
    <text x="620" y="442">It is what a page publishes to be usable without a</text>
    <text x="620" y="462">mouse — so it costs nothing extra to read.</text>
  </g>
</svg>