<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="forkTitle forkDesc">
  <title id="forkTitle">Two ways to run the same extension</title>
  <desc id="forkDesc">Two rows of three boxes each. The first row, under YOUR MACHINE, runs the agent loop in a Container — captioned your machine, your disk, free and permanent — so the run record lands on your disk. The second row, under OUR MACHINE, runs that loop at agent.brotto.dev instead, captioned we run it, invite-only, beta and yours to keep. Either way the Chrome extension, captioned your tab and your cookies, is one end and Your provider, captioned your key and your money, is the other; only the heavier-ruled middle box changes.</desc>

  <rect width="900" height="384" fill="#FFFFFF"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">
    <text x="32" y="34">YOUR MACHINE</text>
    <text x="32" y="238">OUR MACHINE</text>
  </g>

  <!-- Track one: self-host. The middle box is the one that changes, so it
       carries the heavier rule — hierarchy by border weight, not colour. -->
  <g>
    <rect x="32" y="62" width="250" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Chrome extension</text>
    <text x="52" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your tab, your cookies</text>

    <line x1="282" y1="90" x2="312" y2="90" stroke="#C9C9C9"/>
    <path d="M318 90 L308 84 L308 96 Z" fill="#C9C9C9"/>

    <rect x="318" y="62" width="250" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="338" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Container</text>
    <text x="338" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your machine, your disk</text>
    <text x="338" y="160" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5C5C5C">free &#183; permanent</text>

    <line x1="568" y1="90" x2="598" y2="90" stroke="#C9C9C9"/>
    <path d="M604 90 L594 84 L594 96 Z" fill="#C9C9C9"/>

    <rect x="604" y="62" width="264" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="624" y="97" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Your provider</text>
    <text x="624" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your key, your money</text>
  </g>

  <!-- Track two: the cloud beta. Same two ends, different middle. -->
  <g>
    <rect x="32" y="266" width="250" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="52" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Chrome extension</text>
    <text x="52" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your tab, your cookies</text>

    <line x1="282" y1="294" x2="312" y2="294" stroke="#C9C9C9"/>
    <path d="M318 294 L308 288 L308 300 Z" fill="#C9C9C9"/>

    <rect x="318" y="266" width="250" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="338" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">agent.brotto.dev</text>
    <text x="338" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">we run it, invite-only</text>
    <text x="338" y="364" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5C5C5C">beta &#183; yours to keep</text>

    <line x1="568" y1="294" x2="598" y2="294" stroke="#C9C9C9"/>
    <path d="M604 294 L594 288 L594 300 Z" fill="#C9C9C9"/>

    <rect x="604" y="266" width="264" height="56" fill="#FFFFFF" stroke="#C9C9C9"/>
    <text x="624" y="301" font-family="-apple-system, system-ui, sans-serif" font-size="19" font-weight="600" fill="#000000">Your provider</text>
    <text x="624" y="348" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">your key, your money</text>
  </g>
</svg>
