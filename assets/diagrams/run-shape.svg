<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-labelledby="runTitle runDesc">
  <title id="runTitle">The shape of one run</title>
  <desc id="runDesc">A single run of fourteen steps drawn as a line. Two stops interrupt it — both on decisions only you could make — and the run ends done. The record of the whole thing lands on your disk.</desc>

  <rect width="900" height="170" fill="#FFFFFF"/>

  <text x="32" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="1.6" fill="#6E6E6E">ONE RUN, FOURTEEN STEPS</text>

  <!-- The run as a line. Steps are ticks; the two stops are the only heavy marks. -->
  <line x1="48" y1="88" x2="852" y2="88" stroke="#C9C9C9" stroke-width="2"/>

  <g stroke="#C9C9C9" stroke-width="2">
    <line x1="48" y1="80" x2="48" y2="96"/>
    <line x1="106" y1="80" x2="106" y2="96"/>
    <line x1="164" y1="80" x2="164" y2="96"/>
    <line x1="222" y1="80" x2="222" y2="96"/>
    <line x1="280" y1="80" x2="280" y2="96"/>
    <line x1="396" y1="80" x2="396" y2="96"/>
    <line x1="454" y1="80" x2="454" y2="96"/>
    <line x1="512" y1="80" x2="512" y2="96"/>
    <line x1="570" y1="80" x2="570" y2="96"/>
    <line x1="686" y1="80" x2="686" y2="96"/>
    <line x1="744" y1="80" x2="744" y2="96"/>
    <line x1="802" y1="80" x2="802" y2="96"/>
    <line x1="852" y1="80" x2="852" y2="96"/>
  </g>

  <!-- The two stops. These are the point of the picture. -->
  <g>
    <line x1="338" y1="52" x2="338" y2="124" stroke="#DC2626" stroke-width="2"/>
    <circle cx="338" cy="88" r="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="338" y="42" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#DC2626">STOP</text>
    <text x="338" y="148" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a domain it has not visited</text>
  </g>

  <g>
    <line x1="628" y1="52" x2="628" y2="124" stroke="#DC2626" stroke-width="2"/>
    <circle cx="628" cy="88" r="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="628" y="42" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#DC2626">STOP</text>
    <text x="628" y="148" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">a choice only you can make</text>
  </g>

  <!-- The end of the run. -->
  <circle cx="852" cy="88" r="7" fill="#15803D"/>
  <text x="852" y="42" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#15803D">DONE</text>
  <text x="852" y="148" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#6E6E6E">on your disk</text>

  <!-- Below the line, not above it: at y=42 this shared the legend's row and
       "ONE RUN, FOURTEEN STEPS" runs to x≈277, so the two collided. -->
  <text x="48" y="120" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1.2" fill="#6E6E6E">YOU ASK</text>
</svg>
